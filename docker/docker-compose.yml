# TV1 phụ trách, hoàn thiện ở tuần 8.
# Chạy:  docker compose -f docker/docker-compose.yml up --build

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Dev_Password123!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=db;Database=ATS;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Password123!};TrustServerCertificate=True"
      # Khoá AI đọc từ file .env — KHÔNG commit file này
      OpenAI__ApiKey: "${OPENAI_API_KEY}"
    ports:
      - "8080:8080"

volumes:
  mssql-data:
