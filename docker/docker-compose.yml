# TV1 phụ trách, hoàn thiện ở tuần 8.
# Chạy:  docker compose -f docker/docker-compose.yml up --build
#
# Sáu container, khớp với sơ đồ triển khai trong docs/architecture.md mục 5:
#   web → api → db            (nghiệp vụ, đồng bộ)
#   api → queue → worker      (sàng lọc AI hàng loạt, bất đồng bộ — xem ADR-2)
#   api → OpenAI              (preview 1 CV cho ứng viên, đồng bộ — ngoại lệ của ADR-2, UC-05)
#   api/worker → mailhog      (email; dev không gửi ra Internet)
#
# CSDL là PostgreSQL, không phải SQL Server: xem docs/architecture.md mục 3.4.
#
# File biến môi trường: docker/.env (KHÔNG phải .env ở thư mục gốc).
# `docker compose -f docker/docker-compose.yml` chỉ nạp .env nằm cạnh file này.
#
# Cổng phía host đều đổi được qua biến môi trường. Máy ai đang chạy sẵn thứ khác
# ở 8080 thì đặt API_PORT=18080 trong docker/.env, KHÔNG sửa file này —
# sửa file này là cả nhóm phải sửa theo.

# Cấu hình dùng chung của api và worker. Viết MỘT lần ở đây rồi merge vào cả hai
# bằng `<<: *app-common`.
#
# Đây là cách làm cho "AiProvider của api và worker phải giống nhau" trở thành
# bất khả thi về mặt cú pháp, thay vì một dòng comment cảnh báo mà người sửa vội
# có thể bỏ qua. Giá trị chỉ tồn tại đúng một literal.
x-app-common: &app-common
  ConnectionStrings__Default: "Host=db;Port=5432;Database=ats;Username=ats;Password=${POSTGRES_PASSWORD:-Dev_Password123!}"
  Redis__ConnectionString: "queue:6379"
  FileStorage__RootPath: "/app/data/cvs"
  OpenAI__ApiKey: "${OPENAI_API_KEY}"
  AiProvider: "${AI_PROVIDER:-Fake}"
  Smtp__Host: "${SMTP_HOST:-mailhog}"
  Smtp__Port: "${SMTP_PORT:-1025}"
  Smtp__From: "${SMTP_FROM:-no-reply@ats.local}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Dev_Password123!}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      retries: 10

  queue:
    image: redis:7-alpine
    # appendonly: ghi việc xuống đĩa để khởi động lại không mất hàng đợi.
    # Đây chính là điểm khác biệt so với hàng đợi in-memory đã bị loại ở ADR-2.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROJECT_PATH: src/Hosts/ATS.Api
        PROJECT_DLL: ATS.Api.dll
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    environment:
      # API CÓ gọi LLM — nhưng chỉ cho đúng một việc: POST /api/ai/score-preview,
      # tức ứng viên xem % phù hợp của 1 CV trước khi nộp (UC-05). Đây là ngoại lệ
      # có chủ đích của ADR-2, có timeout cứng 30s và rate-limit 20 lượt/ngày chặn lại.
      # Sàng lọc HÀNG LOẠT vẫn đi qua queue → worker, API không bao giờ chạy lô.
      <<: *app-common
      # Development để Swagger UI bật — kế hoạch dự phòng khi chậm tiến độ dựa vào
      # Swagger để demo, nên nó phải chạy được trong container. Deploy thật thì đặt
      # ASPNETCORE_ENVIRONMENT=Production trong docker/.env.
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      Ai__PreviewTimeoutSeconds: "30"
      # Áp migration lúc khởi động — chỉ dùng cho dev/demo.
      # Khi deploy thật: đặt "false" và chạy `dotnet ef database update` ở bước riêng.
      Database__AutoMigrate: "${DB_AUTO_MIGRATE:-true}"
      Jwt__Secret: "${JWT_SECRET:-change-me-at-least-32-characters-long-secret}"
      Jwt__Issuer: "${JWT_ISSUER:-ats-recruitment}"
      Jwt__Audience: "${JWT_AUDIENCE:-ats-recruitment-users}"
    volumes:
      - cv-files:/app/data/cvs
    ports:
      - "${API_PORT:-8080}:8080"

  # Worker KHÔNG mở cổng ra ngoài — nó chỉ đọc hàng đợi.
  # Cần chạy nhiều bản sao khi lô CV lớn:  docker compose up --scale worker=3
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROJECT_PATH: src/Hosts/ATS.Worker
        PROJECT_DLL: ATS.Worker.dll
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    environment:
      # Khoá AI đọc từ docker/.env — KHÔNG commit file đó.
      # Worker lo phần nặng: sàng lọc hàng loạt (ADR-2) và sinh câu hỏi phỏng vấn (ADR-3).
      # Cùng một literal với api, không thể lệch.
      <<: *app-common
    volumes:
      - cv-files:/app/data/cvs
    restart: unless-stopped

  # Hộp thư giả cho môi trường dev: mọi email (mời phỏng vấn, đặt lại mật khẩu)
  # rơi vào đây thay vì gửi ra Internet. Mở http://localhost:8025 để đọc.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"   # giao diện web
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROJECT_PATH: src/Hosts/ATS.Web
        PROJECT_DLL: ATS.Web.dll
    depends_on:
      - api
    environment:
      ApiBaseUrl: "http://api:8080"
    ports:
      - "${WEB_PORT:-8081}:8080"

volumes:
  pg-data:
  redis-data:
  cv-files:
