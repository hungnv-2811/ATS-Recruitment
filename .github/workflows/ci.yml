name: CI

on:
  push:
    branches: [ main, nvhung, 'feature/**' ]
  pull_request:
    branches: [ main, nvhung ]

# Push mới vào một PR sẽ huỷ lần chạy cũ còn dở — đỡ xếp hàng chờ khi cả nhóm cùng push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Đây là status check bắt buộc trong branch protection của `main` và `nvhung`.
  # Đổi tên job này thì phải vào Settings → Branches chọn lại check, nếu không
  # branch protection sẽ chờ một check không bao giờ chạy. Xem CONTRIBUTING.md mục 3.6.
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres THAT cho bo test Category=Postgres (migration, seeder, SQL bao cao, quota
    # ON CONFLICT, unique khi nop don dong thoi). InMemory khong chay duoc nhung thu nay.
    # Moi lan chay, test tu tao mot database ats_test_<guid> rieng roi xoa.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats"
          --health-interval 5s
          --health-retries 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Phiên bản SDK đọc từ global.json, không ghi lại ở đây — một nguồn duy nhất.
      - name: Cài .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Không có cache thì mỗi lần push của cả 4 người đều tải lại EF Core, Npgsql,
      # Swashbuckle, Test.Sdk... từ nuget.org. Khoá theo Directory.Packages.props vì
      # đó là nơi duy nhất khai báo version (Central Package Management).
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Kiểm định dạng (whitespace, style, analyzer) trước khi build: lỗi kiểu này
      # rẻ nhất khi bắt ở CI, không phải ở buổi review. Sửa tại máy: `dotnet format`.
      - name: Kiểm định dạng code
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        env:
          ATS_TEST_POSTGRES: "Host=localhost;Port=5432;Username=ats;Password=ci_password;Database=postgres"
        run: dotnet test --no-build --configuration Release --verbosity normal
