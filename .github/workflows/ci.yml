name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

# Push mới vào một PR sẽ huỷ lần chạy cũ còn dở — đỡ xếp hàng chờ khi cả nhóm cùng push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Đây là status check bắt buộc trong branch protection của `main` và `develop`.
  # Đổi tên job này thì phải vào Settings → Branches chọn lại check, nếu không
  # branch protection sẽ chờ một check không bao giờ chạy. Xem CONTRIBUTING.md mục 3.6.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Trước tuần 2 repo chưa có solution — bước này giúp CI không đỏ oan.
      - name: Kiểm tra đã có solution chưa
        id: check
        run: |
          if ls *.sln src/*.sln >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::notice::Chưa có file .sln — bỏ qua build/test."
          fi

      - name: Restore
        if: steps.check.outputs.found == 'true'
        run: dotnet restore

      - name: Build
        if: steps.check.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.check.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release --verbosity normal
