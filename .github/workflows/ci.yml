name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

# Push mới vào một PR sẽ huỷ lần chạy cũ còn dở — đỡ xếp hàng chờ khi cả nhóm cùng push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Đây là status check bắt buộc trong branch protection của `main` và `develop`.
  # Đổi tên job này thì phải vào Settings → Branches chọn lại check, nếu không
  # branch protection sẽ chờ một check không bao giờ chạy. Xem CONTRIBUTING.md mục 3.6.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Trước tuần 2 repo chưa có solution — bước này giúp CI không đỏ oan.
      - name: Kiểm tra đã có solution chưa
        id: check
        run: |
          if ls *.sln src/*.sln >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::notice::Chưa có file .sln — bỏ qua build/test."
          fi

      - name: Restore
        if: steps.check.outputs.found == 'true'
        run: dotnet restore

      - name: Build
        if: steps.check.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.check.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release --verbosity normal

  # Nhắc nhở khi PR quá lớn. CHỈ CẢNH BÁO, không chặn merge — đừng thêm job này
  # vào danh sách status check bắt buộc. Ngưỡng 400 dòng: xem CONTRIBUTING.md mục 3.4.
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Đo số dòng thay đổi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Không tính file sinh tự động: migration EF Core, file khoá gói, ảnh.
          total=$(gh pr view "$PR" --repo "$REPO" --json files --jq '
            [ .files[]
              | select(.path | test("Migrations/|\\.Designer\\.cs$|package-lock\\.json$|\\.(png|jpg|jpeg|svg|ico)$") | not)
              | .additions + .deletions
            ] | add // 0' || echo 0)
          total=${total:-0}
          echo "Số dòng thay đổi (đã trừ file sinh tự động): $total"
          if [ "$total" -gt 400 ]; then
            echo "::warning::PR này thay đổi $total dòng, vượt ngưỡng 400 của CONTRIBUTING.md mục 3.4. Cân nhắc tách nhỏ — khả năng bắt lỗi của người review giảm mạnh ở PR lớn."
          fi
